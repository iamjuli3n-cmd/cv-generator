<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Connection</title>

<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f3f4f6;

    font-family:Arial;

}

.box{

    width:350px;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 2px 10px rgba(0,0,0,.1);

}

input{

    width:100%;

    padding:12px;

    margin-bottom:15px;

}

button{

    width:100%;

    padding:12px;

    background:#2563eb;

    border:none;

    color:white;

    border-radius:8px;

    cursor:pointer;

}

</style>

</head>

<body>

<div class="box">

<h2>

Connection

</h2>

<form action="/login" method="post">

<input
    type="text"
    name="username"
    placeholder="Username"
    required>

<input
    type="password"
    name="password"
    placeholder="Password"
    required>

<button type="submit">

Login

</button>

</form>

</div>

</body>

</html>
